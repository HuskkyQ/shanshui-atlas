<main id="house-preview" class="house-preview">
  <header class="house-header">
    <a class="house-back" href="./" aria-label="返回山水志首页">← 山水志</a>
    <span class="house-collection">建筑习作 / 001</span>
  </header>
  <section class="house-intro" aria-labelledby="house-title">
    <p class="house-eyebrow">ARCHITECTURAL STUDY</p>
    <h1 id="house-title">一间山居</h1>
    <p>灰瓦覆顶，白墙围合。独立房屋模型。</p>
  </section>
  <div id="house-canvas" class="house-canvas" role="img" aria-label="可旋转、缩放的单层中式房屋三维模型"></div>
  <p id="house-loading" class="house-loading" role="status">正在展开房屋…</p>
  <footer class="house-footer">
    <div class="house-caption">
      <p>单层中式民居 <span>JIANGNAN HOUSE</span></p>
      <span id="house-dimensions"></span>
    </div>
    <nav class="house-views" aria-label="房屋观察视角">
      <button type="button" data-house-view="overview" aria-pressed="true">总览</button>
      <button type="button" data-house-view="front" aria-pressed="false">正面</button>
      <button type="button" data-house-view="back" aria-pressed="false">背面</button>
    </nav>
    <p class="house-gestures">拖动旋转 · 滚轮缩放 · Shift＋拖动平移</p>
    <p class="house-note">艺术化外观模型，尺寸用于展示。</p>
  </footer>
</main>
